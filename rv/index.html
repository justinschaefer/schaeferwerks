<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>RV Deal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=Source+Sans+3:wght@400;600&family=Overpass+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one column of listing rows, highway-sign header, filter chips; rows go two-column on wide screens */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a63; --line:#d9dfdb;
  --accent:#0b6b46; --accent-ink:#ffffff; --top:#b8860b; --good:#2f6fae; --warn:#a14a2a;
  --display:"Overpass","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --fg:#e6ebe8; --muted:#9aa7a0; --line:#2c3531;
  --accent:#3fae7f; --accent-ink:#0c1410; --top:#e0b54a; --good:#6fa8e0; --warn:#e08a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --fg:#e6ebe8; --muted:#9aa7a0; --line:#2c3531;
  --accent:#3fae7f; --accent-ink:#0c1410; --top:#e0b54a; --good:#6fa8e0; --warn:#e08a66; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header.sign{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;border:3px solid var(--accent-ink);outline:2px solid var(--accent)}
header.sign h1{font:800 clamp(24px,5vw,34px)/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
header.sign p{margin:0;font-size:15px;opacity:.92}
.stamp{display:flex;flex-wrap:wrap;gap:4px 18px;font:600 14px var(--body)!important;opacity:1!important}
.searchnow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px!important;font:600 14px var(--body)!important;opacity:1!important}
.srch{font:800 14px var(--body);background:var(--accent-ink);color:var(--accent);border:0;border-radius:8px;padding:7px 14px;min-height:36px;cursor:pointer}
.srch[disabled]{opacity:.65;cursor:default}
.srch:focus-visible{outline:3px solid var(--top);outline-offset:2px}
.specs{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.act:focus-visible,a:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.bar label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
select{font:600 15px var(--body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:40px}
.count{font:500 13px var(--mono);color:var(--muted);margin-left:auto}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;min-width:0}
.row.dim{opacity:.55}
.row .main{min-width:0;display:flex;flex-direction:column;gap:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.tag.top{color:var(--top)} .tag.good{color:var(--good)} .tag.maybe{color:var(--muted)} .tag.kind{color:var(--accent)}
.tag.st-interested{background:var(--good);color:var(--surface);border-color:var(--good)}
.tag.st-sold,.tag.st-pass{color:var(--warn)}
.tag.new{background:var(--top);color:var(--surface);border-color:var(--top)}
.tag.built{color:var(--fg)}
.title{font:800 19px/1.2 var(--display);margin:0;text-wrap:balance}
.title a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.title a:hover{text-decoration-color:var(--accent)}
.meta{color:var(--muted);font-size:14px}
.note{font-size:15px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.price{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}
.was{font:500 12px var(--mono);color:var(--muted);text-decoration:line-through}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.act{font:600 14px var(--body);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:7px 11px;cursor:pointer;min-height:38px}
.act.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 18px;color:var(--muted);text-align:center}
@media (max-width:560px){.row{grid-template-columns:1fr}.side{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;justify-content:space-between;width:100%}.acts{justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.row{transition:opacity .2s}}
.ro .acts{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="sign">
    <span class="specs">Portland, OR · Jeep tow limit 7,200 lb · under 25 ft · bathroom</span>
    <h1>RV Deal Tracker</h1>
    <p>Every ad I find, with links. I add new ones each morning. Tap Interested, Pass or Sold to sort them.</p>
    <p class="stamp"><span id="now"></span><span id="upd">Last updated: loading…</span></p>
    <p class="stamp" id="warn" hidden></p>
    <p class="searchnow"><button class="srch" id="srch" type="button">Search now</button><span id="srchmsg" role="status"></span></p>
  </header>

  <div class="bar" role="group" aria-label="Filter by type">
    <button class="chip" id="f-all" data-f="all" aria-pressed="true">All</button>
    <button class="chip" id="f-top" data-f="t:19\s?fbth|[eg]-?\s?19\s?th\b|19\s?fs\b" aria-pressed="false">Geo Pro toy haulers</button>
    <button class="chip" id="f-wb" data-f="built" aria-pressed="false">Well built</button>
    <button class="chip" id="f-th" data-f="Toy hauler" aria-pressed="false">Toy haulers</button>
    <button class="chip" id="f-as" data-f="Airstream" aria-pressed="false">Airstreams</button>
    <button class="chip" id="f-wp" data-f="t:wolf pup" aria-pressed="false">Wolf Pups</button>
    <button class="chip" id="f-rp" data-f="t:r-pod" aria-pressed="false">R-Pods</button>
    <button class="chip" id="f-ep" data-f="t:e-pro|19fbth|e19" aria-pressed="false">E-Pros</button>
    <button class="chip" id="f-tt" data-f="Travel trailer" aria-pressed="false">Other trailers</button>
    <button class="chip" id="f-int" data-f="interested" aria-pressed="false">My interested</button>
  </div>
  <div class="bar">
    <label for="sort">Sort
      <select id="sort">
        <option value="found">Newest found</option>
        <option value="pick">Best picks first</option>
        <option value="price">Lowest price</option>
        <option value="dist">Closest</option>
      </select>
    </label>
    <label for="hide"><input type="checkbox" id="hide" checked> Hide passed &amp; sold</label>
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list">
    <div class="empty">Loading listings… New finds are added every morning.</div>
  </div>
</div>

<script>
// The RV Deal Tracker page, now fed by the daily search on the MacBook Pro (data.json) instead of Claude.
// Interested / Pass / Sold are saved on schaeferwerks.com through the same ranks API as Coast Land Scout,
// which stores {stars, pass}: Interested = 5 stars, Pass = pass, Sold = pass with 1 star.
const $ = s => document.querySelector(s);
const API = '/rv/api/ratings';
let rows = [], filter = 'all', ratings = {}, data = {};
const RANK = {top:0, good:1, maybe:2};
try { const s = JSON.parse(localStorage.getItem('rvt-ui2')||'{}'); if (s.sort) $('#sort').value = s.sort; if (s.hide===false) $('#hide').checked = false; } catch(e){}
function saveUi(){ try{ localStorage.setItem('rvt-ui2', JSON.stringify({sort:$('#sort').value, hide:$('#hide').checked})); }catch(e){} }
const money = n => n ? '$' + Number(n).toLocaleString('en-US') : 'Call';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = loc(new Date()), yday = loc(new Date(Date.now()-864e5));

// A mark saved under this ad's id, or under an earlier id for it (the old tracker's, or before a repost).
function mark(x){ if (ratings[x.id]) return ratings[x.id]; for (const a of (x.aliases||[])) if (ratings[a]) return ratings[a]; return {}; }
function statusOf(x){ const m = mark(x); return m.pass ? (m.stars===1 ? 'sold' : 'pass') : (m.stars ? 'interested' : 'new'); }

function render(){
  let r = rows.slice();
  r = r.filter(x => x.fit !== 'no' && x.bath !== 'no');  // the Jeep can't tow it, or no bathroom
  if (filter === 'interested') r = r.filter(x => x.status === 'interested');
  else if (filter === 'built') r = r.filter(x => x.built);
  else if (filter.startsWith('t:')) { const re = new RegExp(filter.slice(2), 'i'); r = r.filter(x => re.test(x.title || '')); }
  else if (filter !== 'all') r = r.filter(x => x.kind === filter);
  if ($('#hide').checked) r = r.filter(x => x.status !== 'pass' && x.status !== 'sold');
  const s = $('#sort').value;
  const P = x => x.price || 1e9, D = x => x.miles ?? 1e9;
  // Best picks: top, then good, then maybe; within each, the best deal first (new or not).
  r.sort((a,b) => (s==='price' ? P(a)-P(b) : s==='dist' ? D(a)-D(b) : s==='found' ? (String(b.found).localeCompare(String(a.found)) || (RANK[a.rating]??3)-(RANK[b.rating]??3) || b.score-a.score) : (RANK[a.rating]??3)-(RANK[b.rating]??3) || b.score-a.score));
  $('#count').textContent = r.length + ' of ' + rows.filter(x => x.fit !== 'no' && x.bath !== 'no').length + ' ads';
  const list = $('#list');
  if (!rows.length) { list.innerHTML = '<div class="empty">No listings yet. New finds are added here every morning.</div>'; return; }
  if (!r.length) { list.innerHTML = '<div class="empty">Nothing matches this filter.</div>'; return; }
  list.innerHTML = r.map(x => {
    const fresh = x.found === today || x.found === yday;
    const title = x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title);
    const st = x.status && x.status !== 'new' ? `<span class="tag st-${esc(x.status)}">${esc(x.status)}</span>` : '';
    const btn = (v,l) => `<button class="act${x.status===v?' on':''}" data-id="${esc(x.id)}" data-v="${v}">${l}</button>`;
    const note = [x.note, x.old_note ? 'Earlier note: ' + x.old_note : ''].filter(Boolean).join(' ');
    return `<article class="row${x.status==='pass'||x.status==='sold'?' dim':''}">
      <div class="main">
        <div class="tags">${fresh?'<span class="tag new">'+(x.found===today?'New today':'New yesterday')+'</span>':''}<span class="tag ${esc(x.rating)}">${x.rating==='top'?'Top pick':esc(x.rating||'')}</span><span class="tag kind">${esc(x.kind)}</span>${x.family==='Geo Pro / E-Pro 19FBTH'?'<span class="tag new">Top model</span>':''}${x.built?'<span class="tag built">Well built · '+esc(x.built)+'</span>':''}${st}</div>
        <h2 class="title">${title}</h2>
        <div class="meta">${esc(x.location)}${x.miles!=null?' · ~'+x.miles+' mi':''} · ${esc(x.seller)} · ${esc(x.source)} · found ${esc(x.found)}</div>
        ${note?`<div class="note">${esc(note)}</div>`:''}
      </div>
      <div class="side">
        <div><div class="price">${money(x.price)}</div>${x.was?`<div class="was">${money(x.was)}</div>`:''}</div>
        <div class="acts">${btn('interested','Interested')}${btn('pass','Pass')}${btn('sold','Sold')}</div>
      </div>
    </article>`;
  }).join('');
}

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', o===c));
  render();
}));
$('#sort').addEventListener('change', () => { saveUi(); render(); });
$('#hide').addEventListener('change', () => { saveUi(); render(); });
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('.act'); if (!b) return;
  const x = rows.find(r => r.id === b.dataset.id); if (!x) return;
  const v = x.status === b.dataset.v ? 'new' : b.dataset.v;
  const body = {id: x.id, stars: v==='interested' ? 5 : v==='sold' ? 1 : 0, pass: v==='pass' || v==='sold'};
  const prev = x.status; x.status = v; render();
  try {
    const res = await fetch(API, {method:'POST', headers:{'content-type':'application/json'}, credentials:'same-origin', body: JSON.stringify(body)});
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || res.status);
    ratings = await res.json();
  } catch(err) { x.status = prev; render(); alert("Couldn't save that: " + err.message); }
});

const fmt = d => d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function tick(){ $('#now').textContent = 'Now: ' + fmt(new Date()); }
tick(); setInterval(tick, 30000);
function showUpd(){
  const t = data.updated ? new Date(data.updated) : null;
  const added = rows.filter(x => x.found === data.asof).length;
  $('#upd').textContent = t && !isNaN(t) ? 'Last updated: ' + fmt(t) + ' · ' + added + ' new ads' : 'Last updated: unknown';
  if ((data.warnings||[]).length) { $('#warn').hidden = false; $('#warn').textContent = '⚠ ' + data.warnings.join(' '); }
}
render();
// "Search now": asks the MacBook Pro (which checks every 2 minutes) to run the search; the ads reload when it's done.
const SAPI = '/rv/api/search';
let srchTimer = null, loadedAt = 0;
const hm = t => t ? new Date(t).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : '';
function showSearch(st){
  const b = $('#srch'), m = $('#srchmsg');
  if (st.status === 'requested') {
    b.disabled = true;
    m.textContent = (Date.now() - Date.parse(st.requested)) / 60000 > 6
      ? 'Waiting for the MacBook Pro since ' + hm(st.requested) + '; it may be asleep or off. The search starts when it wakes.'
      : 'Search requested at ' + hm(st.requested) + '. The MacBook Pro starts it within 2 minutes.';
  } else if (st.status === 'searching') {
    b.disabled = true; m.textContent = 'Searching since ' + hm(st.started) + '. New ads show up here in about 10 minutes.';
  } else {
    b.disabled = false; m.textContent = st.error || '';
  }
  clearTimeout(srchTimer);
  if (st.status !== 'idle') srchTimer = setTimeout(pollSearch, 20000);
}
async function pollSearch(){
  try {
    const st = await (await fetch(SAPI, {credentials:'same-origin', cache:'no-store'})).json();
    if (st.status === 'idle' && st.finished && Date.parse(st.finished) > loadedAt) { await load(); st.error = 'Search finished at ' + hm(st.finished) + '.'; }
    showSearch(st);
  } catch(e) { srchTimer = setTimeout(pollSearch, 60000); }
}
$('#srch').addEventListener('click', async () => {
  $('#srch').disabled = true;
  try {
    const st = await (await fetch(SAPI, {method:'POST', credentials:'same-origin'})).json();
    showSearch(st);
  } catch(e) { $('#srch').disabled = false; $('#srchmsg').textContent = "Couldn't ask for a search: " + e.message; }
});

async function load(){
  try { const r = await fetch('data.json', {cache:'no-cache'}); data = r.ok ? await r.json() : {}; } catch(e) { data = {}; }
  try { const r = await fetch(API, {credentials:'same-origin', cache:'no-store'}); if (r.ok) ratings = await r.json(); } catch(e) {}
  loadedAt = Date.now();
  rows = (data.rows || []).map(x => Object.assign(x, {found: x.first, was: x.dropFrom, status: statusOf(x)}));
  render(); showUpd();
}
(async () => {
  await load();
  // Links ending in #<ad id> open with every filter cleared and that ad first.
  const hid = decodeURIComponent(location.hash.slice(1));
  if (hid && rows.some(x => x.id === hid)) { $('#hide').checked = false; const x = rows.find(x => x.id === hid); x.found = '9999'; render(); }
  pollSearch();
})();
</script>

</body>
</html>
