<div id="lightbox">
  <button class="lb-close" onclick="closeLB()">CLOSE &#10005;</button>
  <button class="lb-nav lb-prev" onclick="navLB(-1)">&#8249;</button>
  <button class="lb-nav lb-next" onclick="navLB(1)">&#8250;</button>
  <div class="lb-frame">
    <img id="lbImg" src="" alt="">
    <div class="lb-count" id="lbCount"></div>
  </div>
</div>


<script>
  var gallery = Array.prototype.map.call(document.querySelectorAll('.gallery img'), function(im){ return im.getAttribute('data-full') || im.src; });
  var currentIndex = 0;
  function openLB(i) { currentIndex = i; renderLB(); document.getElementById('lightbox').classList.add('open'); }
  function closeLB() { document.getElementById('lightbox').classList.remove('open'); }
  function navLB(delta) { currentIndex = (currentIndex + delta + gallery.length) % gallery.length; renderLB(); }
  function renderLB() {
    document.getElementById('lbImg').src = gallery[currentIndex];
    document.getElementById('lbCount').textContent = (currentIndex+1) + ' / ' + gallery.length;
  }
  document.querySelectorAll('.gallery .frame').forEach(function(frame, i){
    frame.addEventListener('click', function(){ openLB(i); });
  });
  document.getElementById('lightbox').addEventListener('click', function(e){
    if (e.target.id === 'lightbox') closeLB();
  });
  document.addEventListener('keydown', function(e){
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowLeft') navLB(-1);
    if (e.key === 'ArrowRight') navLB(1);
  });
</script>
